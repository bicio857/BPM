<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BPM</title>
<style>
:root{--bg:#f4f4f7;--card:#fff;--tx:#17171a;--mu:#7d7d89;--ac:#e8336d;--ln:#e3e3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e12;--card:#1a1a21;--tx:#f2f2f6;--mu:#8e8e9a;--ac:#ff4f87;--ln:#2b2b35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e12;--card:#1a1a21;--tx:#f2f2f6;--mu:#8e8e9a;--ac:#ff4f87;--ln:#2b2b35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:3px;padding:3px;background:var(--ln);border-radius:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:600 15px -apple-system,system-ui,sans-serif;padding:9px;border-radius:9px}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card{background:var(--card);border-radius:22px;padding:26px 18px 20px;margin:14px 0;text-align:center}
.lbl{font-size:13px;letter-spacing:3px;color:var(--mu);font-weight:600}
.big{font-size:92px;font-weight:800;letter-spacing:-2px;line-height:1.05;font-variant-numeric:tabular-nums}
.msg{min-height:2.7em;color:var(--mu);font-size:14px;line-height:1.35;margin-top:6px}
.bar{height:4px;background:var(--ln);border-radius:2px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .25s linear}
.opt{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.opt input{width:84px;text-align:right;font-size:16px;color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:6px 8px}
canvas{display:block;width:100%;height:160px;background:var(--card);border-radius:16px;margin-bottom:12px}
.stats{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.6}
.go{width:100%;border:0;border-radius:16px;background:var(--ac);color:#fff;font:700 18px -apple-system,system-ui,sans-serif;padding:17px;touch-action:manipulation}
.go.stop{background:var(--tx);color:var(--bg)}
.go.tap{padding:64px 0;font-size:34px;letter-spacing:4px}
.ghost{width:100%;border:0;background:none;color:var(--mu);font:600 15px -apple-system,system-ui,sans-serif;padding:14px}
.hide{display:none}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0e0e12">
<meta name="apple-mobile-web-app-title" content="BPM">
</head>
<body>
<main class="app">
  <div class="tabs" id="tabs">
    <button data-m="listen" class="on">Ascolta</button>
    <button data-m="band">Band</button>
    <button data-m="tap">Tap</button>
  </div>
  <section class="card">
    <div class="lbl" id="lbl">BPM</div>
    <div class="big" id="big">--</div>
    <div class="msg" id="msg"></div>
    <div class="bar" id="barw"><i id="bar"></i></div>
  </section>
  <div class="opt hide" id="opt"><label for="target">Tempo previsto (facoltativo)</label><input id="target" type="number" inputmode="numeric" min="40" max="240" placeholder="BPM"></div>
  <canvas id="chart" class="hide"></canvas>
  <div class="stats hide" id="stats"></div>
  <button class="go" id="go">Ascolta</button>
  <button class="ghost hide" id="reset">Azzera</button>
</main>
<script>
const $ = id => document.getElementById(id);
const BLOCK = 256, LISTEN_S = 12, WIN_S = 10, STEP_S = 2;
let mode = "listen", ctx = null, stream = null, proc = null, env = [], rate = 0;
let running = false, timer = null, readings = [], lastA = 0, wake = null, taps = [];

function show(b){ $("big").textContent = Math.round(b); }
function setBar(p){ $("bar").style.width = Math.min(Math.max(p, 0), 1) * 100 + "%"; }
function median(a){ const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }

async function startAudio(){
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(1024, 1, 1);
  rate = ctx.sampleRate / BLOCK;
  env = [];
  proc.onaudioprocess = e => {
    const d = e.inputBuffer.getChannelData(0);
    for (let i = 0; i + BLOCK <= d.length; i += BLOCK){
      let s = 0;
      for (let j = i; j < i + BLOCK; j++) s += d[j] * d[j];
      env.push(Math.sqrt(s / BLOCK));
    }
  };
  const mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
}

function releaseAudio(){
  try { if (proc) proc.disconnect(); } catch (e) {}
  try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { if (ctx) ctx.close(); } catch (e) {}
  try { if (wake) wake.release(); } catch (e) {}
  proc = stream = ctx = wake = null;
}

// Autocorrelazione degli attacchi sonori
function analyze(seg, lo, hi, prior){
  const n = seg.length;
  if (n < rate * 4) return null;
  const on = new Float32Array(n);
  let m = 0;
  for (let i = 1; i < n; i++){ const v = seg[i] - seg[i - 1]; on[i] = v > 0 ? v : 0; m += on[i]; }
  m /= n;
  let e0 = 0;
  for (let i = 0; i < n; i++){ on[i] -= m; e0 += on[i] * on[i]; }
  if (e0 < 1e-10) return null;
  const minL = Math.max(2, Math.floor(rate * 60 / hi));
  const maxL = Math.min(n - 3, Math.ceil(rate * 60 / lo));
  if (maxL <= minL + 1) return null;
  const sc = new Float64Array(maxL + 2), raw = new Float64Array(maxL + 2);
  let best = minL, bs = -Infinity;
  for (let L = minL; L <= maxL; L++){
    let s = 0;
    for (let i = 0; i < n - L; i++) s += on[i] * on[i + L];
    const ac = (s / (n - L)) / (e0 / n);
    const b = 60 * rate / L;
    const w = prior ? Math.exp(-Math.pow(Math.log2(b / 120), 2) / 2) : 1;
    raw[L] = ac; sc[L] = ac * w;
    if (sc[L] > bs){ bs = sc[L]; best = L; }
  }
  if (bs <= 0) return null;
  let lag = best;
  if (best > minL && best < maxL){
    const a = sc[best - 1], b = sc[best], c = sc[best + 1], d = a - 2 * b + c;
    if (d !== 0) lag += 0.5 * (a - c) / d;
  }
  return { bpm: 60 * rate / lag, conf: raw[best] };
}

function tick(){
  const el = env.length / rate;
  if (mode === "listen"){
    setBar(el / LISTEN_S);
    if (el >= LISTEN_S){
      const r = analyze(env, 60, 180, true);
      stop();
      if (r && r.conf > 0.05){ show(r.bpm); $("msg").textContent = "Fatto. Se il valore è il doppio o la metà, prova con Tap."; }
      else $("msg").textContent = "Non trovo un ritmo chiaro. Prova con più volume o un brano più ritmato.";
    }
    return;
  }
  const mm = Math.floor(el / 60), ss = String(Math.floor(el % 60)).padStart(2, "0");
  $("lbl").textContent = "BPM · " + mm + ":" + ss;
  if (el >= WIN_S && el - lastA >= STEP_S){
    lastA = el;
    const seg = env.slice(-Math.floor(WIN_S * rate));
    const t = parseFloat($("target").value);
    let lo = 60, hi = 180, pr = true;
    if (t >= 40 && t <= 240){ lo = t * 0.8; hi = t * 1.2; pr = false; }
    else if (readings.length >= 3){ const md = median(readings.slice(-8).map(x => x.b)); lo = md * 0.85; hi = md * 1.15; pr = false; }
    const r = analyze(seg, lo, hi, pr);
    if (r && r.conf > 0.05){ readings.push({ t: el, b: r.bpm }); show(r.bpm); draw(); }
  }
}

async function start(){
  try { await startAudio(); }
  catch (e){ $("msg").textContent = "Microfono non disponibile o permesso negato. Controlla le impostazioni del browser per questo sito."; releaseAudio(); return; }
  running = true; readings = []; lastA = 0;
  $("big").textContent = "--"; setBar(0);
  $("go").textContent = "Ferma"; $("go").classList.add("stop");
  $("msg").textContent = mode === "band" ? "Sto misurando il tempo del brano…" : "Sto ascoltando…";
  $("chart").classList.add("hide"); $("stats").classList.add("hide");
  if (mode === "band"){ try { wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
  timer = setInterval(tick, 250);
}

function stop(){
  clearInterval(timer); timer = null;
  releaseAudio();
  running = false;
  $("go").textContent = "Ascolta"; $("go").classList.remove("stop");
}

function toggle(){
  if (running){
    const was = mode;
    stop();
    if (was === "band") summary(); else $("msg").textContent = "Ascolto interrotto";
  } else start();
}

function summary(){
  $("lbl").textContent = "BPM";
  const bs = readings.map(r => r.b), n = bs.length;
  if (n < 3){ $("msg").textContent = "Misurazione troppo breve per un riepilogo."; return; }
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const mean = avg(bs), sd = Math.sqrt(avg(bs.map(b => (b - mean) ** 2)));
  const k = Math.max(1, Math.floor(n / 3)), drift = avg(bs.slice(-k)) - avg(bs.slice(0, k));
  const tr = Math.abs(drift) < 2 ? "Tempo costante" : (drift > 0 ? "Tendi ad accelerare" : "Tendi a rallentare");
  const t = parseFloat($("target").value);
  let h = "<b>" + tr + "</b> (" + (drift > 0 ? "+" : "") + drift.toFixed(1) + " BPM dall’inizio alla fine)<br>" +
    "Medio " + mean.toFixed(1) + " · Min " + Math.min(...bs).toFixed(0) + " · Max " + Math.max(...bs).toFixed(0) + "<br>" +
    "Oscillazione ±" + sd.toFixed(1) + " BPM";
  if (t > 0) h += "<br>Scarto dal tempo previsto: " + (mean - t > 0 ? "+" : "") + (mean - t).toFixed(1) + " BPM";
  $("stats").innerHTML = h; $("stats").classList.remove("hide");
  $("msg").textContent = "Misurazione conclusa.";
  draw();
}

function draw(){
  const c = $("chart"); c.classList.remove("hide");
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = 160;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const ac = css.getPropertyValue("--ac").trim(), ln = css.getPropertyValue("--ln").trim(), mu = css.getPropertyValue("--mu").trim();
  const t = parseFloat($("target").value), bs = readings.map(r => r.b);
  let lo = Math.min(...bs), hi = Math.max(...bs);
  if (t > 0){ lo = Math.min(lo, t); hi = Math.max(hi, t); }
  const pad = Math.max(5, (hi - lo) * 0.25); lo -= pad; hi += pad;
  const t0 = readings[0].t, span = Math.max(readings[readings.length - 1].t - t0, 1);
  const X = v => 12 + (W - 62) * ((v - t0) / span);
  const Y = v => H - 16 - (H - 32) * (v - lo) / (hi - lo);
  g.font = "11px -apple-system,sans-serif"; g.textBaseline = "middle";
  [lo, (lo + hi) / 2, hi].forEach(v => {
    g.strokeStyle = ln; g.lineWidth = 1; g.beginPath(); g.moveTo(12, Y(v)); g.lineTo(W - 46, Y(v)); g.stroke();
    g.fillStyle = mu; g.fillText(Math.round(v), W - 40, Y(v));
  });
  if (t > 0){
    g.setLineDash([5, 4]); g.strokeStyle = mu; g.beginPath(); g.moveTo(12, Y(t)); g.lineTo(W - 46, Y(t)); g.stroke(); g.setLineDash([]);
  }
  g.strokeStyle = ac; g.lineWidth = 2.5; g.lineJoin = "round"; g.beginPath();
  readings.forEach((r, i) => { i ? g.lineTo(X(r.t), Y(r.b)) : g.moveTo(X(r.t), Y(r.b)); });
  g.stroke();
  const L = readings[readings.length - 1];
  g.fillStyle = ac; g.beginPath(); g.arc(X(L.t), Y(L.b), 4, 0, 7); g.fill();
}

function tap(){
  const n = performance.now();
  if (taps.length && n - taps[taps.length - 1] > 2500) taps = [];
  taps.push(n);
  if (taps.length > 8) taps.shift();
  if (taps.length >= 2){
    show(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
    $("msg").textContent = taps.length + " tocchi";
  }
}

function setMode(m){
  stop(); mode = m;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  $("opt").classList.toggle("hide", m !== "band");
  $("chart").classList.add("hide"); $("stats").classList.add("hide");
  $("barw").classList.toggle("hide", m !== "listen");
  $("reset").classList.toggle("hide", m !== "tap");
  $("go").classList.toggle("tap", m === "tap");
  $("go").textContent = m === "tap" ? "TAP" : "Ascolta";
  $("lbl").textContent = m === "tap" ? "TAP TEMPO" : "BPM";
  $("big").textContent = "--"; setBar(0); taps = [];
  $("msg").textContent = {
    listen: "Avvicina il dispositivo alla musica: servono circa 12 secondi.",
    band: "Premi Ascolta all’inizio del brano: misuro il tempo per tutta la durata e ne traccio l’andamento.",
    tap: "Tocca il pulsante a ritmo."
  }[m];
}

document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.m)));
$("go").addEventListener("pointerdown", e => { if (mode === "tap"){ e.preventDefault(); tap(); } });
$("go").addEventListener("click", () => { if (mode !== "tap") toggle(); });
$("reset").addEventListener("click", () => { taps = []; $("big").textContent = "--"; $("msg").textContent = "Tocca il pulsante a ritmo."; });
try { $("target").value = localStorage.getItem("bpm_target") || ""; } catch (e) {}
$("target").addEventListener("input", () => { try { localStorage.setItem("bpm_target", $("target").value); } catch (e) {} });
setMode("listen");
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
